
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="description" content="Acceso a la plataforma empresarial CLICK COMMERCE">
  <title>Acceso | CLICK COMMERCE</title>

  <style>
    :root {
      --azul: #0B1F3A;
      --azul-claro: #15365D;
      --dorado: #D9B45B;
      --fondo: #F3F5F8;
      --texto: #172337;
      --gris: #738096;
      --borde: #DCE2EA;
      --blanco: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-family: "Times New Roman", Times, serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Times New Roman", Times, serif;
    }

    button,
    input {
      font-family: "Times New Roman", Times, serif;
    }

    /* ENCABEZADO */

    .encabezado {
      min-height: 100px;
      padding: 20px 7%;
      background: var(--azul);
      display: flex;
      align-items: center;
      gap: 17px;
      border-bottom: 3px solid var(--dorado);
    }

    .espacio-logo {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(217, 180, 91, 0.75);
      border-radius: 10px;
      color: var(--dorado);
      font-size: 12px;
      text-align: center;
    }

    .marca {
      color: var(--blanco);
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .marca span {
      color: var(--dorado);
    }

    .submarca {
      margin-top: 7px;
      color: #D4DCE7;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    /* CONTENIDO PRINCIPAL */

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 18px;
    }

    .tarjeta {
      width: 100%;
      max-width: 440px;
      padding: 38px;
      background: var(--blanco);
      border: 1px solid #E7EAF0;
      border-radius: 16px;
      box-shadow: 0 16px 45px rgba(11, 31, 58, 0.09);
    }

    .linea-dorada {
      width: 50px;
      height: 4px;
      margin-bottom: 23px;
      background: var(--dorado);
      border-radius: 5px;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--azul);
      font-size: 29px;
      font-weight: bold;
    }

    .descripcion {
      margin: 0 0 29px;
      color: var(--gris);
      font-size: 15px;
      line-height: 1.6;
    }

    /* CAMPOS */

    .campo {
      margin-bottom: 21px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: var(--azul);
      font-size: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 49px;
      padding: 0 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      outline: none;
      background: var(--blanco);
      color: var(--texto);
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #8993A3;
      opacity: 1;
    }

    input:focus {
      border-color: var(--dorado);
      box-shadow: 0 0 0 3px rgba(217, 180, 91, 0.17);
    }

    .contrasena-contenedor {
      position: relative;
    }

    .contrasena-contenedor input {
      padding-right: 82px;
    }

    .ver-contrasena {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 7px 4px;
      border: none;
      background: transparent;
      color: var(--azul-claro);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    /* BOTÓN */

    .boton {
      width: 100%;
      min-height: 50px;
      margin-top: 5px;
      padding: 12px;
      border: 1px solid var(--azul);
      border-radius: 8px;
      background: var(--azul);
      color: var(--dorado);
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.7px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .boton:hover {
      background: var(--azul-claro);
      border-color: var(--azul-claro);
    }

    .boton:focus-visible,
    .ver-contrasena:focus-visible {
      outline: 2px solid var(--dorado);
      outline-offset: 3px;
    }

    .boton:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    /* MENSAJES */

    .mensaje {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .mensaje.error {
      display: block;
      color: #8B1E2D;
      background: #FFF0F1;
      border: 1px solid #F1C8CD;
    }

    .mensaje.exito {
      display: block;
      color: #145C3B;
      background: #ECF8F0;
      border: 1px solid #BFE5CD;
    }

    .seguridad {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #EDF0F4;
      color: var(--gris);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .seguridad strong {
      color: var(--azul);
      font-size: 14px;
    }

    /* PIE DE PÁGINA */

    footer {
      padding: 20px 12px;
      color: #788397;
      font-size: 13px;
      text-align: center;
    }

    footer span {
      color: #A27C2B;
    }

    /* ADAPTACIÓN A CELULARES */

    @media (max-width: 480px) {
      .encabezado {
        min-height: 88px;
        padding: 16px 20px;
        gap: 12px;
      }

      .espacio-logo {
        width: 48px;
        height: 48px;
        font-size: 11px;
      }

      .marca {
        font-size: 21px;
      }

      .submarca {
        font-size: 11px;
        line-height: 1.4;
      }

      main {
        padding: 30px 16px;
      }

      .tarjeta {
        padding: 28px 23px;
      }

      h1 {
        font-size: 27px;
      }

      .descripcion {
        font-size: 15px;
      }
    }

    @media (max-width: 340px) {
      .marca {
        font-size: 19px;
      }

      .submarca {
        font-size: 10px;
      }

      .tarjeta {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <header class="encabezado">
    <div
      class="espacio-logo"
      aria-label="Espacio reservado para el futuro logo"
    >
      TU LOGO
    </div>

    <div>
      <div class="marca">CLICK <span>COMMERCE</span></div>
      <div class="submarca">PLATAFORMA DE GESTIÓN EMPRESARIAL</div>
    </div>
  </header>

  <main>
    <section class="tarjeta" aria-labelledby="tituloAcceso">
      <div class="linea-dorada"></div>

      <h1 id="tituloAcceso">Bienvenido</h1>

      <p class="descripcion">
        Ingresa con tus credenciales para acceder a CLICK COMMERCE.
      </p>

      <form id="formularioAcceso" autocomplete="on">
        <div class="campo">
          <label for="usuario">Usuario</label>

          <input
            id="usuario"
            name="username"
            type="text"
            placeholder="Escribe tu usuario"
            autocomplete="username"
            maxlength="80"
            required
          >
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>

          <div class="contrasena-contenedor">
            <input
              id="contrasena"
              name="password"
              type="password"
              placeholder="Escribe tu contraseña"
              autocomplete="current-password"
              maxlength="1024"
              required
            >

            <button
              class="ver-contrasena"
              id="botonVer"
              type="button"
              aria-label="Mostrar contraseña"
            >
              Mostrar
            </button>
          </div>
        </div>

        <button
          class="boton"
          id="botonIngresar"
          type="submit"
        >
          INGRESAR
        </button>

        <div
          class="mensaje"
          id="mensaje"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <div class="seguridad">
        <strong>Acceso para usuarios autorizados</strong><br>
        Protege tus credenciales y no las compartas.
      </div>
    </section>
  </main>

  <footer>
    © <span id="anio"></span> CLICK COMMERCE · Gestión empresarial
  </footer>

  <script>
    const URL_LOGIN =
      "https://dqannkyvzthcycbiuacs.supabase.co/functions/v1/username-login";

    const formulario =
      document.getElementById("formularioAcceso");

    const usuario =
      document.getElementById("usuario");

    const contrasena =
      document.getElementById("contrasena");

    const botonIngresar =
      document.getElementById("botonIngresar");

    const botonVer =
      document.getElementById("botonVer");

    const mensaje =
      document.getElementById("mensaje");

    document.getElementById("anio").textContent =
      new Date().getFullYear();

    botonVer.addEventListener("click", () => {
      const mostrar = contrasena.type === "password";

      contrasena.type = mostrar ? "text" : "password";
      botonVer.textContent = mostrar ? "Ocultar" : "Mostrar";

      botonVer.setAttribute(
        "aria-label",
        mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "mensaje " + tipo;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      mensaje.textContent = "";
      mensaje.className = "mensaje";

      botonIngresar.disabled = true;
      botonIngresar.textContent = "VERIFICANDO...";

      let accesoCorrecto = false;

      try {
        const respuesta = await fetch(URL_LOGIN, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: usuario.value.trim(),
            password: contrasena.value
          })
        });

        let resultado;

        try {
          resultado = await respuesta.json();
        } catch {
          throw new Error("RESPUESTA_INVALIDA");
        }

        if (!respuesta.ok) {
          mostrarMensaje(
            resultado.error ||
              "No se pudo iniciar sesión. Verifica tus datos.",
            "error"
          );
          return;
        }

        if (
          !resultado.access_token ||
          !resultado.refresh_token ||
          !resultado.user
        ) {
          mostrarMensaje(
            "La respuesta del servicio está incompleta. Intenta nuevamente.",
            "error"
          );
          return;
        }

        try {
          sessionStorage.setItem(
            "clickCommerceSession",
            JSON.stringify({
              access_token: resultado.access_token,
              refresh_token: resultado.refresh_token,
              expires_in: resultado.expires_in,
              user: resultado.user
            })
          );
        } catch {
          mostrarMensaje(
            "No se pudo guardar la sesión en este navegador. Revisa su configuración.",
            "error"
          );
          return;
        }

        accesoCorrecto = true;
        contrasena.value = "";

        mostrarMensaje(
          "¡Acceso verificado correctamente! El panel de administración se conectará en el siguiente paso.",
          "exito"
        );

        botonIngresar.textContent = "ACCESO VERIFICADO";

      } catch (error) {
        mostrarMensaje(
          error.message === "RESPUESTA_INVALIDA"
            ? "El servicio respondió de forma inesperada. Inténtalo nuevamente."
            : "No se pudo conectar con el servicio de acceso. Comprueba tu conexión e inténtalo nuevamente.",
          "error"
        );
      } finally {
        botonIngresar.disabled = false;

        if (!accesoCorrecto) {
          botonIngresar.textContent = "INGRESAR";
        }
      }
    });
  </script>
</body>
</html>
